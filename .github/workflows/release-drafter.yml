name: Release Drafter

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-24.04

    steps:
      - name: Draft release
        uses: release-drafter/release-drafter@c345907820e0396f6f44bcfd9ac4763325f8feb0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
