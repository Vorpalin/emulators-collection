name: Release Drafter

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-24.04

    steps:
      - name: Draft release
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
