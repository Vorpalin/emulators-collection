name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "include/**"
      - "docs/**"
      - "web/src/**"
      - "web/typedoc.json"
      - "web/tsconfig.json"
      - "web/package.json"
      - "web/package-lock.json"
      - "scripts/generate_wiki.py"
      - "Doxyfile"
      - ".github/workflows/documentation.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation
  cancel-in-progress: true

jobs:
  documentation:
    name: Generate and publish Wiki
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------------
      # Setup
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      # ------------------------------------------------------------------
      # C++ documentation (Doxygen -> Markdown)
      # ------------------------------------------------------------------
      - name: Generate Doxygen XML
        run: |
          mkdir -p build/doxygen
          doxygen Doxyfile

      - name: Generate C++ API pages
        run: python3 scripts/generate_wiki.py

      - name: Verify C++ documentation
        run: |
          test -f build/wiki/api/API.md
          echo "Generated C++ pages:"
          find build/wiki/api -type f -name '*.md' -print

      # ------------------------------------------------------------------
      # Web documentation (TypeDoc -> Markdown)
      # ------------------------------------------------------------------
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Generate Web API pages
        working-directory: web
        run: npm run docs

      - name: Verify Web documentation
        run: |
          test -f build/wiki/web/Web-API.md
          echo "Generated Web pages:"
          find build/wiki/web -type f -name '*.md' | wc -l

      # ------------------------------------------------------------------
      # Wiki publication
      # ------------------------------------------------------------------
      - name: Clone GitHub Wiki
        run: |
          git clone \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" \
            wiki

      - name: Synchronize handwritten documentation
        run: |
          if [ -d "docs" ]; then
            find docs -maxdepth 1 -type f -name '*.md' -exec cp {} wiki/ \;
          fi

      - name: Synchronize C++ API documentation
        run: |
          mkdir -p wiki/API
          find wiki/API -type f -name '*.md' -delete
          cp build/wiki/api/*.md wiki/API/

      - name: Synchronize Web documentation
        run: |
          rm -rf wiki/Web
          mkdir -p wiki/Web
          cp -r build/wiki/web/. wiki/Web/

      - name: Create API Reference page
        run: |
          cat > wiki/API-Reference.md << 'EOF'
          # API Reference

          Documentation generated automatically from the source code.

          - [C++ emulator cores](API/API) (Doxygen)
          - [Web frontend](Web/Web-API) (TypeDoc)

          ---

          *This page is automatically generated. Do not edit it manually.*
          EOF

      - name: Commit and push Wiki changes
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "docs: update Wiki documentation"
          git push
