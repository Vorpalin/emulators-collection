name: Close stale issues

on:
  schedule:
    - cron: '30 1 * * *'

  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-24.04

    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          stale-issue-message: >
            This issue has been inactive for 30 days
            and will be closed if no further activity occurs.

          stale-pr-message: >
            This pull request has been inactive for 30 days
            and will be closed if no further activity occurs.

          days-before-stale: 30
          days-before-close: 7

          stale-issue-label: stale
          stale-pr-label: stale
