version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Odd-numbered Node releases are not LTS. Move to the next LTS major by hand,
      # together with CI and the README, instead of taking every major bump.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
