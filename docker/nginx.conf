# nginx configuration of the production image (see the `production` stage of the Dockerfile).
# The image runs as an unprivileged user, hence the port above 1024.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # The WebAssembly module is the largest asset and compresses very well.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json
               image/svg+xml application/wasm;

    # Build output is content-hashed by Vite: it never changes under the same name.
    # (expires, unlike add_header, keeps the security headers above for these locations.)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The service worker, its helpers and the manifest are not hashed: browsers must
    # revalidate them on every visit or an update would never reach the installed app.
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-[^/]+\.js)$ {
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # Single-page application: client-side routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
